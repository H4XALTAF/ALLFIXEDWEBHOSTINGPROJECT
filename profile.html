<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4X ALTAF | My Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
/* ===== PROFILE SPECIFIC STYLES ===== */
.container { max-width: 800px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 10; }
.page-title { font: 900 26px Orbitron; margin-bottom: 25px; text-align: center; }
.page-title span { color: var(--red); }

.profile-card { background: rgba(18,12,12,0.85); border: 1px solid var(--border); border-radius: 16px; padding: 30px; margin-bottom: 25px; }

/* PROFILE HEADER */
.profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; padding-bottom: 25px; border-bottom: 1px solid var(--border); }
.avatar-box { width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, var(--dark-red), #210000); border: 2px solid var(--red); display: grid; place-items: center; font: 900 32px Orbitron; color: white; box-shadow: 0 0 20px var(--red-glow); }
.user-info h2 { font: 800 22px Orbitron; margin-bottom: 5px; }
.user-info p { color: #888; font-size: 13px; }
.user-info .badge { display: inline-block; background: rgba(34,197,94,0.1); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-top: 8px; }

/* FORM */
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 11px; color: #bbb; font-weight: 700; margin-bottom: 8px; }
.form-group input { width: 100%; padding: 15px; background: #000; border: 1px solid #333; border-radius: 8px; color: white; outline: none; font-size: 13px; transition: 0.3s; }
.form-group input:focus { border-color: var(--red); box-shadow: 0 0 10px var(--red-glow); }
.form-group input:disabled { background: #111; color: #666; cursor: not-allowed; border-color: #222; }

.submit-btn { width: 100%; padding: 15px; border: none; border-radius: 8px; background: linear-gradient(110deg, var(--red), var(--dark-red)); color: white; font-weight: 900; font-size: 13px; cursor: pointer; margin-top: 10px; box-shadow: 0 5px 20px var(--red-glow); transition: 0.3s; }
.submit-btn:hover { transform: translateY(-3px); filter: brightness(1.2); }

.msg-box { display: none; padding: 12px; border-radius: 8px; font-size: 11px; text-align: center; margin-bottom: 15px; }
.msg-success { display: block; background: rgba(34,197,94,0.1); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
.msg-error { display: block; background: rgba(255,37,37,0.1); color: #ff5555; border: 1px solid rgba(255,37,37,0.3); }
</style>
</head>
<body class="theme-red" onload="loadProfile()">

<div id="fire-layer"></div>

<nav class="navbar">
    <a href="dashboard.html" class="brand">
        <img src="https://i.postimg.cc/C5tfyH1H/file-00000000ba30820b8f4a7075c4fd3a41.png" alt="Logo" class="brand-logo">
        <div class="brand-text">H4X <span>ALTAF</span></div>
    </a>
    <div style="display:flex; gap:15px; align-items:center;">
        <div class="color-switcher">
            <div class="color-btn red active" onclick="changeTheme('theme-red', this)"></div>
            <div class="color-btn blue" onclick="changeTheme('theme-blue', this)"></div>
            <div class="color-btn green" onclick="changeTheme('theme-green', this)"></div>
            <div class="color-btn purple" onclick="changeTheme('theme-purple', this)"></div>
        </div>
        <a href="dashboard.html" class="back-btn">← BACK</a>
    </div>
</nav>

<div class="container">
    <h1 class="page-title">MY <span>PROFILE</span></h1>

    <!-- Profile Card -->
    <div class="profile-card">
        <div class="profile-header">
            <div class="avatar-box" id="avatarLetter">U</div>
            <div class="user-info">
                <h2 id="profileName">User Name</h2>
                <p id="profileEmail">user@example.com</p>
                <span class="badge">● Verified Account</span>
            </div>
        </div>

        <h3 style="font: 800 16px Orbitron; margin-bottom: 20px;">Account Settings</h3>
        
        <div id="msgBox" class="msg-box"></div>

        <form id="profileForm" onsubmit="updateProfile(event)">
            <div class="form-group">
                <label>FULL NAME</label>
                <input type="text" id="inputName" required>
            </div>
            <div class="form-group">
                <label>EMAIL ADDRESS (Cannot be changed)</label>
                <input type="email" id="inputEmail" disabled>
            </div>
            <div class="form-group">
                <label>NEW PASSWORD (Leave blank to keep current)</label>
                <input type="password" id="inputPassword" placeholder="Enter new password">
            </div>
            
            <button type="submit" class="submit-btn">SAVE CHANGES</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
<script>
    // Current logged in user ka data laao
    let currentUser = JSON.parse(localStorage.getItem("h4x_user"));

    function loadProfile() {
        if(!currentUser) {
            window.location.href = "index.html";
            return;
        }

        // Data fill karo
        document.getElementById("profileName").innerText = currentUser.name;
        document.getElementById("profileEmail").innerText = currentUser.email;
        document.getElementById("avatarLetter").innerText = currentUser.name.charAt(0).toUpperCase();

        document.getElementById("inputName").value = currentUser.name;
        document.getElementById("inputEmail").value = currentUser.email;
    }

    function updateProfile(e) {
        e.preventDefault();

        let newName = document.getElementById("inputName").value;
        let newPass = document.getElementById("inputPassword").value;
        let msg = document.getElementById("msgBox");

        // Agar name khali hai
        if(!newName.trim()) {
            msg.className = "msg-box msg-error";
            msg.innerText = "Name cannot be empty!";
            return;
        }

        // Update User Object
        currentUser.name = newName;
        
        // Agar naya password dala hai to update karo
        if(newPass.trim() !== "") {
            currentUser.password = newPass;
        }

        // Save to LocalStorage
        localStorage.setItem("h4x_user", JSON.stringify(currentUser));

        // UI Update
        document.getElementById("profileName").innerText = currentUser.name;
        document.getElementById("avatarLetter").innerText = currentUser.name.charAt(0).toUpperCase();
        document.getElementById("inputPassword").value = ""; // password clear karo

        // Success Message
        msg.className = "msg-box msg-success";
        msg.innerText = "✅ Profile updated successfully!";
        
        setTimeout(() => { msg.style.display = "none"; }, 3000);
    }
</script>
</body>
</html>
