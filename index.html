<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4X ALTAF | Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{ --red:#ff2525; --red-glow:rgba(255, 37, 37, 0.4); --dark:#080808; --card:#111; --border:#351818; --muted:#999; }
body.theme-red    { --red:#ff2525; --red-glow:rgba(255,37,37,0.40); }
body.theme-blue   { --red:#00d2ff; --red-glow:rgba(0,210,255,0.40); }
body.theme-green  { --red:#00ff88; --red-glow:rgba(0,255,136,0.40); }
body.theme-purple { --red:#b800ff; --red-glow:rgba(184,0,255,0.40); }

*{margin:0;padding:0;box-sizing:border-box}
body{ min-height:100vh; background:var(--dark); color:white; font-family:Inter,sans-serif; display:flex; flex-direction:column; overflow-x:hidden; position:relative; }
body:before, body:after{ content:""; position:fixed; width:320px; height:320px; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:-2; }
body:before{ background:var(--red-glow); opacity:0.3; top:-130px; right:-100px; }
body:after{ background:var(--red-glow); opacity:0.2; bottom:-130px; left:-100px; }
a{text-decoration:none;color:inherit}

/* FIRE LAYER */
#fire-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.fire { position: absolute; background: linear-gradient(to top, #ff0000, #ff4500, #ff8c00, transparent); border-radius: 50% 50% 0 0; box-shadow: 0 0 15px #ff0000; animation: fireAnim linear infinite; }
.fire.bottom { bottom: -20px; border-radius: 50% 50% 0 0; animation-name: fireUp; }
.fire.top { top: -20px; border-radius: 0 0 50% 50%; background: linear-gradient(to bottom, #ff0000, #ff4500, #ff8c00, transparent); animation-name: fireDown; }
.fire.left { left: -20px; border-radius: 0 50% 50% 0; background: linear-gradient(to right, #ff0000, #ff4500, #ff8c00, transparent); animation-name: fireRight; }
.fire.right { right: -20px; border-radius: 50% 0 0 50%; background: linear-gradient(to left, #ff0000, #ff4500, #ff8c00, transparent); animation-name: fireLeft; }
@keyframes fireUp { 0% { transform: translateY(0) scale(0.8); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 0.6; } 100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } }
@keyframes fireDown { 0% { transform: translateY(0) scale(0.8); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 0.6; } 100% { transform: translateY(100vh) scale(1.5); opacity: 0; } }
@keyframes fireRight { 0% { transform: translateX(0) scale(0.8); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 0.6; } 100% { transform: translateX(100vw) scale(1.5); opacity: 0; } }
@keyframes fireLeft { 0% { transform: translateX(0) scale(0.8); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 0.6; } 100% { transform: translateX(-100vw) scale(1.5); opacity: 0; } }

.navbar{ height:72px; padding:0 5%; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #321414; background:#0b0b0b; position:relative; z-index:10; }
.brand{ display:flex; align-items:center; gap:11px; font:900 20px Orbitron; }
.brand-text b span{ color:var(--red); }
.right-nav{ display:flex; align-items:center; gap:15px; }
.color-switcher{ display:flex; gap:8px; background:#150a0a; padding:6px 10px; border-radius:20px; border:1px solid #3a1515; }
.color-btn{ width:16px; height:16px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
.color-btn.active{ border-color:#fff; transform:scale(1.1); box-shadow:0 0 10px currentColor; }
.color-btn.red{ background:#ff2525; color:#ff2525; }
.color-btn.blue{ background:#00d2ff; color:#00d2ff; }
.color-btn.green{ background:#00ff88; color:#00ff88; }
.color-btn.purple{ background:#b800ff; color:#b800ff; }

.main{ flex:1; display:flex; align-items:center; justify-content:center; padding:45px 18px; position:relative; z-index:10; }
.layout{ width:100%; max-width:950px; display:grid; grid-template-columns:1fr 420px; align-items:center; gap:55px; }
.intro h1{ font:900 clamp(35px,5vw,57px)/1.2 Orbitron; }
.intro h1 span{ color:var(--red); text-shadow:0 0 25px var(--red-glow); }
.intro p{ color:#999; font-size:12px; line-height:2; max-width:420px; margin-top:18px; }

.auth-card{ background:rgba(18,12,12,0.65); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08); border-top:1px solid var(--red-glow); border-left:1px solid var(--red-glow); border-radius:18px; padding:32px 28px; box-shadow:0 20px 50px rgba(0,0,0,0.8),0 0 40px var(--red-glow); }
.card-heading{ text-align:center; margin-bottom:25px; }
.card-heading h2 span{ color:var(--red); }
.tabs{ display:grid; grid-template-columns:1fr 1fr; background:rgba(0,0,0,0.5); border:1px solid #321818; padding:5px; border-radius:9px; margin-bottom:25px; }
.tab{ padding:11px; border:0; border-radius:6px; color:#888; background:transparent; font-size:10px; font-weight:800; cursor:pointer; }
.tab.active{ color:white; background:linear-gradient(110deg,var(--red),#3a0000); box-shadow:0 3px 15px var(--red-glow); }
.form-section{ display:none; }
.form-section.active{ display:block; }
.field{ margin-bottom:17px; }
.field label{ display:block; color:#bbb; font-size:10px; font-weight:700; margin-bottom:9px; }
.field input{ width:100%; height:45px; padding:0 13px; border:1px solid #382020; border-radius:8px; background:rgba(9,9,9,0.8); color:white; outline:none; font-size:11px; }
.field input:focus{ border-color:var(--red); box-shadow:0 0 0 3px var(--red-glow); }
.submit{ width:100%; height:46px; border:0; border-radius:8px; background:linear-gradient(110deg,var(--red),#3a0000); color:white; font-weight:900; font-size:11px; cursor:pointer; box-shadow:0 5px 20px var(--red-glow); margin-top:10px; }
.msg{ display:none; padding:11px; border-radius:7px; font-size:10px; margin-bottom:15px; text-align:center; }
.msg.error{ display:block; background:#3b1010; color:#ff7777; border:1px solid #792020; }
.msg.success{ display:block; background:#102b17; color:#7dff9c; border:1px solid #205a32; }

.music-toggle{ position:fixed; bottom:25px; right:25px; z-index:1000; width:55px; height:55px; border-radius:50%; background:linear-gradient(135deg,#1a0505,#0a0202); border:1px solid var(--red-glow); color:var(--red); font-size:24px; display:grid; place-items:center; cursor:pointer; box-shadow:0 0 15px var(--red-glow); animation:musicPulse 2.5s infinite; }
@keyframes musicPulse{ 0%,100%{box-shadow:0 0 15px var(--red-glow)} 50%{box-shadow:0 0 30px var(--red)} }
.music-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:1100; display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; transition:.3s; }
.music-overlay.open{ opacity:1; visibility:visible; }
.music-card{ width:90%; max-width:380px; background:rgba(18,12,12,0.95); border:1px solid var(--red-glow); border-radius:18px; padding:30px 25px; position:relative; }
.close-music{ position:absolute; top:15px; right:15px; background:none; border:none; color:#888; font-size:24px; cursor:pointer; }
.song-info{ text-align:center; padding:14px; background:rgba(0,0,0,0.4); border:1px solid #321818; border-radius:10px; margin-bottom:15px; }
.song-name{ font:800 15px Orbitron; color:var(--red); }
.player-controls{ display:flex; justify-content:center; gap:10px; margin-bottom:15px; }
.ctrl-btn{ width:46px; height:46px; border-radius:50%; border:1px solid var(--red-glow); background:rgba(0,0,0,0.6); color:var(--red); font-size:18px; cursor:pointer; }
.ctrl-btn.play-pause{ width:58px; height:58px; background:linear-gradient(135deg,var(--red),#3a0000); color:white; }
select{ width:100%; height:40px; padding:0 10px; background:#000; color:white; border:1px solid #382020; border-radius:8px; outline:none; }

@media(max-width:800px){ .layout{ grid-template-columns:1fr; max-width:430px; } .intro{ text-align:center; } .intro p{ margin:15px auto 0; } }
</style>
</head>
<body class="theme-red">
<div id="fire-layer"></div>
<audio id="bg-music" loop preload="auto"></audio>
<button class="music-toggle" id="musicToggle">🎵</button>

<div class="music-overlay" id="musicOverlay">
    <div class="music-card">
        <button class="close-music" id="closeMusic">✕</button>
        <h3 style="text-align:center;color:var(--red);margin-bottom:15px;font-family:Orbitron;">PHONK PLAYER</h3>
        <div class="song-info"><div class="song-name" id="songName">Phonk #1</div></div>
        <div class="player-controls">
            <button class="ctrl-btn" id="prevBtn">⏮</button>
            <button class="ctrl-btn play-pause" id="playBtn">▶</button>
            <button class="ctrl-btn" id="nextBtn">⏭</button>
        </div>
        <select id="songSelect"></select>
    </div>
</div>

<nav class="navbar">
    <div class="brand"><div class="brand-text"><b>H4X <span>ALTAF</span></b></div></div>
    <div class="right-nav">
        <div class="color-switcher">
            <div class="color-btn red active" onclick="changeTheme('theme-red', this)"></div>
            <div class="color-btn blue" onclick="changeTheme('theme-blue', this)"></div>
            <div class="color-btn green" onclick="changeTheme('theme-green', this)"></div>
            <div class="color-btn purple" onclick="changeTheme('theme-purple', this)"></div>
        </div>
    </div>
</nav>

<main class="main">
    <div class="layout">
        <section class="intro">
            <h1>WELCOME<br>TO <span>H4X ALTAF</span></h1>
            <p>Access your hosting dashboard, manage your services and explore a platform built for your digital projects.</p>
        </section>
        <section class="auth-card">
            <div class="card-heading"><h2>H4X <span>ACCOUNT</span></h2></div>
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">LOGIN</button>
                <button class="tab" onclick="switchTab('register')">REGISTER</button>
            </div>
            <div id="message" class="msg"></div>
            
            <form class="form-section active" id="loginForm">
                <div class="field"><label>EMAIL</label><input type="email" id="loginEmail" required></div>
                <div class="field"><label>PASSWORD</label><input type="password" id="loginPassword" required></div>
                <button type="submit" class="submit">LOGIN TO ACCOUNT →</button>
            </form>

            <form class="form-section" id="registerForm">
                <div class="field"><label>NAME</label><input type="text" id="regName" required></div>
                <div class="field"><label>EMAIL</label><input type="email" id="regEmail" required></div>
                <div class="field"><label>PASSWORD</label><input type="password" id="regPassword" required></div>
                <button type="submit" class="submit">CREATE ACCOUNT →</button>
            </form>
        </section>
    </div>
</main>

<script>
/* THEME */
function changeTheme(c, b){ document.body.className=c; document.querySelectorAll('.color-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }

/* FIRE */
(function(){ const l=document.getElementById("fire-layer"); function f(){ if(l.childElementCount>40)return; const d=document.createElement("div"); d.className="fire"; const e=["bottom","top","left","right"][Math.floor(Math.random()*4)]; d.classList.add(e); const s=Math.random()*15+10; if(e==="bottom"||e==="top"){ d.style.width=s+"px"; d.style.height=(s*1.5)+"px"; d.style.left=(Math.random()*100)+"vw"; } else { d.style.width=(s*1.5)+"px"; d.style.height=s+"px"; d.style.top=(Math.random()*100)+"vh"; } d.style.animationDuration=(Math.random()*2+1.5)+"s"; d.style.animationDelay=(Math.random()*2)+"s"; l.appendChild(d); setTimeout(()=>d.remove(),4000); } for(let i=0;i<40;i++)f(); setInterval(f,150); })();

/* MUSIC */
const SONGS = [{n:"Phonk 1", s:"https://files.catbox.moe/wcv8va.mp3"},{n:"Phonk 2", s:"https://files.catbox.moe/5sp3v3.mp3"},{n:"Phonk 3", s:"https://files.catbox.moe/981mvb.mp3"}];
const music = document.getElementById("bg-music"), playBtn = document.getElementById("playBtn"), songName = document.getElementById("songName"), select = document.getElementById("songSelect"), musicToggle = document.getElementById("musicToggle"), musicOverlay = document.getElementById("musicOverlay");
let currentIndex = 0;
SONGS.forEach((song, i) => { const opt = document.createElement("option"); opt.value = i; opt.textContent = song.n; select.appendChild(opt); });
function loadSong(index, autoPlay=false){ currentIndex = (index + SONGS.length) % SONGS.length; const song = SONGS[currentIndex]; music.src = song.s; songName.textContent = song.n; select.value = currentIndex; if(autoPlay) music.play().then(()=>playBtn.textContent="⏸").catch(()=>{}); else playBtn.textContent = "▶"; }
playBtn.onclick = () => { if(!music.src) { loadSong(currentIndex, true); return; } if(music.paused) { music.play().then(()=>playBtn.textContent="⏸").catch(()=>{}); } else { music.pause(); playBtn.textContent="▶"; } };
document.getElementById("prevBtn").onclick = ()=>loadSong(currentIndex-1, true);
document.getElementById("nextBtn").onclick = ()=>loadSong(currentIndex+1, true);
select.onchange = ()=>loadSong(parseInt(select.value,10), true);
music.onended = ()=>loadSong(currentIndex+1, true);
musicToggle.onclick = ()=>musicOverlay.classList.add("open");
document.getElementById("closeMusic").onclick = ()=>musicOverlay.classList.remove("open");
loadSong(0, false);

/* LOGIN / REGISTER LOGIC */
function switchTab(tab){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.form-section').forEach(f=>f.classList.remove('active'));
    if(tab==='login'){ document.querySelectorAll('.tab')[0].classList.add('active'); document.getElementById('loginForm').classList.add('active'); }
    else { document.querySelectorAll('.tab')[1].classList.add('active'); document.getElementById('registerForm').classList.add('active'); }
    document.getElementById('message').className = "msg";
}

document.getElementById("registerForm").onsubmit = function(e){
    e.preventDefault();
    let name = document.getElementById("regName").value;
    let email = document.getElementById("regEmail").value;
    let pass = document.getElementById("regPassword").value;
    localStorage.setItem("h4x_user", JSON.stringify({name, email, pass, coins: 0}));
    document.getElementById("message").className = "msg success";
    document.getElementById("message").innerText = "Account created! Redirecting to login...";
    setTimeout(()=>switchTab('login'), 1500);
};

document.getElementById("loginForm").onsubmit = function(e){
    e.preventDefault();
    let email = document.getElementById("loginEmail").value;
    let pass = document.getElementById("loginPassword").value;
    let user = JSON.parse(localStorage.getItem("h4x_user"));
    if(user && user.email === email && user.pass === pass){
        localStorage.setItem("h4x_logged_in", "true");
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("message").className = "msg error";
        document.getElementById("message").innerText = "Invalid email or password!";
    }
};
</script>
</body>
</html>
