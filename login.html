<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>H4X ALTAF | Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Master Stylesheet Link -->
<link rel="stylesheet" href="style.css">

<style>
/* Login Page Specific Styles */
.login-container { flex: 1; display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 80px); padding: 30px 20px; position: relative; z-index: 10; }
.login-box { width: 100%; max-width: 420px; background: rgba(18,12,12,0.85); backdrop-filter: blur(20px); border: 1px solid var(--red-glow); border-radius: 18px; padding: 35px 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px var(--red-glow); animation: appear 0.6s ease; }
@keyframes appear { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none} }

.login-box h2 { text-align: center; font: 800 24px Orbitron; margin-bottom: 10px; }
.login-box h2 span { color: var(--red); }
.login-box p { text-align: center; color: #888; font-size: 11px; margin-bottom: 25px; }

.submit-btn { width: 100%; height: 48px; border: none; border-radius: 8px; background: linear-gradient(110deg, var(--red), var(--dark-red)); color: white; font-weight: 900; font-size: 12px; letter-spacing: 1px; cursor: pointer; box-shadow: 0 5px 20px var(--red-glow); transition: 0.3s; }
.submit-btn:hover { transform: translateY(-3px); filter: brightness(1.2); }

.links-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; font-size: 11px; color: #888; }
.links-row a { color: var(--red); text-decoration: none; font-weight: bold; }
.links-row a:hover { text-decoration: underline; }

.signup-link { text-align: center; font-size: 11px; color: #888; margin-top: 25px; border-top: 1px solid var(--border); padding-top: 15px; }
.signup-link a { color: var(--red); text-decoration: none; font-weight: bold; }

.msg { display: none; padding: 12px; border-radius: 8px; font-size: 11px; text-align: center; margin-bottom: 15px; }
.msg.error { display: block; background: rgba(255,0,0,0.1); color: #ff7777; border: 1px solid #792020; }
.msg.success { display: block; background: rgba(0,255,0,0.1); color: #7dff9c; border: 1px solid #205a32; }
</style>
</head>
<body class="theme-red">

<!-- Background Fire Layer -->
<div id="fire-layer"></div>

<!-- Navbar -->
<nav class="navbar">
    <a href="index.html" class="brand">
        <img src="https://i.postimg.cc/C5tfyH1H/file-00000000ba30820b8f4a7075c4fd3a41.png" alt="Logo" class="brand-logo">
        <div class="brand-text">H4X <span>ALTAF</span><small>HOSTING PLATFORM</small></div>
    </a>
    <div class="color-switcher">
        <div class="color-btn red active" onclick="changeTheme('theme-red', this)"></div>
        <div class="color-btn blue" onclick="changeTheme('theme-blue', this)"></div>
        <div class="color-btn green" onclick="changeTheme('theme-green', this)"></div>
        <div class="color-btn purple" onclick="changeTheme('theme-purple', this)"></div>
    </div>
</nav>

<!-- Login Form -->
<div class="login-container">
    <div class="login-box">
        <h2>WELCOME <span>BACK</span></h2>
        <p>Login to manage your hosting services</p>

        <div id="message" class="msg"></div>

        <form onsubmit="handleLogin(event)">
            <div class="field">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="loginEmail" required placeholder="example@mail.com">
            </div>
            <div class="field">
                <label>PASSWORD</label>
                <input type="password" id="loginPassword" required placeholder="Enter your password">
            </div>
            
            <div class="links-row">
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="checkbox" style="accent-color:var(--red);"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn" style="margin-top:20px;">LOGIN NOW →</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Create here</a>
        </div>
    </div>
</div>

<!-- Music Elements -->
<audio id="bg-music" loop preload="auto"></audio>
<button class="music-toggle" id="musicToggle">🎵</button>

<div class="music-overlay" id="musicOverlay">
    <div class="music-card">
        <button class="close-music" id="closeMusic">✕</button>
        <h3>PHONK PLAYER</h3>
        <div class="song-info">
            <div class="now-playing">NOW PLAYING</div>
            <div class="song-name" id="songName">Phonk #1</div>
            <div class="song-count" id="songCount">1 / 5</div>
        </div>
        <div class="player-controls">
            <button class="ctrl-btn" id="prevBtn">⏮</button>
            <button class="ctrl-btn play-pause" id="playBtn">▶</button>
            <button class="ctrl-btn" id="nextBtn">⏭</button>
        </div>
        <div class="select-wrap"><select id="songSelect"></select></div>
        <div class="volume-row">
            <span>VOL</span>
            <input type="range" id="volume" min="0" max="100" value="35">
        </div>
    </div>
</div>

<!-- Master JavaScript Link -->
<script src="script.js"></script>

<!-- Page Specific Login Logic -->
<script>
function handleLogin(e) {
    e.preventDefault();
    
    let email = document.getElementById("loginEmail").value;
    let pass = document.getElementById("loginPassword").value;
    let msg = document.getElementById("message");

    // LocalStorage se data uthao
    let savedUser = JSON.parse(localStorage.getItem("h4x_user"));
    
    // Check karo ki user exist karta hai ya nahi
    if (savedUser && savedUser.email === email && savedUser.password === pass) {
        // Login Success
        msg.className = "msg success";
        msg.innerText = "Login successful! Redirecting to dashboard...";
        
        // Login flag set karo
        localStorage.setItem("h4x_logged_in", "true");
        
        // 1.5 second baad dashboard pe bhej do
        setTimeout(() => { 
            window.location.href = "dashboard.html"; 
        }, 1500);
        
    } else {
        // Login Fail
        msg.className = "msg error";
        msg.innerText = "Invalid email or password!";
    }
}
</script>
</body>
</html>
