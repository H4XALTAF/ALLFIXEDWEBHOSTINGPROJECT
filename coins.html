<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4X ALTAF | My Coins</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ===== THEMES ===== */
:root { --red:#ff2020; --red-glow:rgba(255, 32, 32, 0.4); --dark-red:#850000; --bg:#090909; --border:#302020; }
body.theme-red    { --red:#ff2525; --red-glow:rgba(255,37,37,0.4); --dark-red:#850000; }
body.theme-blue   { --red:#00d2ff; --red-glow:rgba(0,210,255,0.4); --dark-red:#005f7a; }
body.theme-green  { --red:#00ff88; --red-glow:rgba(0,255,136,0.4); --dark-red:#007a40; }
body.theme-purple { --red:#b800ff; --red-glow:rgba(184,0,255,0.4); --dark-red:#5c0080; }

*{margin:0;padding:0;box-sizing:border-box}
body{ background:var(--bg); color:white; font-family:Inter,sans-serif; min-height:100vh; overflow-x:hidden; }

/* ===== FIRE ANIMATION ===== */
#fire-layer { position: fixed; inset: 0; z-index: -10; pointer-events: none; overflow: hidden; }
.fire { position: absolute; background: linear-gradient(to top, #ff0000, #ff4500, #ff8c00, transparent); border-radius: 50% 50% 0 0; box-shadow: 0 0 15px #ff0000; animation: fireAnim linear infinite; }
.fire.bottom { bottom: -20px; border-radius: 50% 50% 0 0; animation-name: fireUp; }
.fire.top { top: -20px; border-radius: 0 0 50% 50%; background: linear-gradient(to bottom, #ff0000, #ff4500, #ff8c00, transparent); animation-name: fireDown; }
.fire.left { left: -20px; border-radius: 0 50% 50% 0; background: linear-gradient(to right, #ff0000, #ff4500, #ff8c00, transparent); animation-name: fireRight; }
.fire.right { right: -20px; border-radius: 50% 0 0 50%; background: linear-gradient(to left, #ff0000, #ff4500, #ff8c00, transparent); animation-name: fireLeft; }
@keyframes fireUp { 0% { transform: translateY(0) scale(0.8); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } }
@keyframes fireDown { 0% { transform: translateY(0) scale(0.8); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(100vh) scale(1.5); opacity: 0; } }
@keyframes fireRight { 0% { transform: translateX(0) scale(0.8); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateX(100vw) scale(1.5); opacity: 0; } }
@keyframes fireLeft { 0% { transform: translateX(0) scale(0.8); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateX(-100vw) scale(1.5); opacity: 0; } }

/* NAVBAR */
.navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; border-bottom: 1px solid var(--border); background: rgba(8,8,8,0.8); backdrop-filter: blur(10px); position: relative; z-index: 10; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-logo { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--red); box-shadow: 0 0 15px var(--red-glow); }
.brand-text { font: 900 18px Orbitron; color: white; }
.brand-text span { color: var(--red); }
.back-btn { color: #aaa; text-decoration: none; font-size: 12px; font-weight: 700; border: 1px solid #452020; padding: 10px 15px; border-radius: 8px; transition: .3s; }
.back-btn:hover { color: white; border-color: var(--red); }

/* MAIN CONTENT */
.container { max-width: 900px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 10; }
.page-title { font: 900 26px Orbitron; margin-bottom: 25px; text-align: center; }
.page-title span { color: var(--red); }

/* COIN CARD */
.balance-card { background: linear-gradient(135deg, #1a0505, #0a0202); border: 1px solid var(--red); border-radius: 18px; padding: 40px 30px; text-align: center; box-shadow: 0 10px 40px var(--red-glow); margin-bottom: 30px; position: relative; overflow: hidden; }
.balance-card::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, var(--red-glow) 0%, transparent 60%); opacity: 0.3; pointer-events: none; }
.balance-card h2 { font-size: 14px; color: #aaa; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }
.balance-card .coin-amount { font: 900 55px Orbitron; color: var(--red); text-shadow: 0 0 20px var(--red-glow); display: flex; align-items: center; justify-content: center; gap: 15px; }
.balance-card .coin-icon { font-size: 40px; }
.balance-card p { color: #888; font-size: 12px; margin-top: 15px; }

/* REDEEM BOX */
.redeem-box { background: rgba(18,12,12,0.85); border: 1px solid #22c55e; border-radius: 12px; padding: 25px; margin-bottom: 30px; box-shadow: 0 0 15px rgba(34,197,94,0.2); }
.redeem-box h3 { font-size: 16px; margin-bottom: 15px; color: #22c55e; font-family: Orbitron; }
.redeem-input-group { display: flex; gap: 10px; }
.redeem-input-group input { flex: 1; padding: 15px; background: #000; border: 1px solid #444; border-radius: 8px; color: white; font-family: monospace; letter-spacing: 2px; outline: none; text-transform: uppercase; }
.redeem-input-group input:focus { border-color: #22c55e; }
.redeem-btn { padding: 0 25px; background: #22c55e; color: #000; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.3s; }
.redeem-btn:hover { background: #16a34a; color: white; }
.msg-box { display:none; margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 12px; text-align: center; }
.msg-error { display:block; background: rgba(255,0,0,0.1); color: #ff7777; border: 1px solid #792020; }
.msg-success { display:block; background: rgba(34,197,94,0.1); color: #7dff9c; border: 1px solid #22c55e; }

/* STATS GRID */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
.stat-box { background: rgba(18,12,12,0.8); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
.stat-box h3 { font-size: 11px; color: #888; margin-bottom: 10px; }
.stat-box p { font: 800 22px Orbitron; color: white; }

/* HISTORY */
.history-section { background: rgba(18,12,12,0.8); border: 1px solid var(--border); border-radius: 12px; padding: 25px; }
.history-section h3 { font: 800 16px Orbitron; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
.history-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #1a1a1a; }
.history-item:last-child { border-bottom: none; }
.history-info h4 { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.history-info p { font-size: 11px; color: #666; }
.history-amount { font: 800 15px Orbitron; }
.amount-plus { color: #22c55e; }
.amount-minus { color: var(--red); }

/* MUSIC BUTTON */
.music-toggle{ position:fixed; bottom:25px; right:25px; z-index:1000; width:55px; height:55px; border-radius:50%; background:linear-gradient(135deg,#1a0505,#0a0202); border:1px solid var(--red-glow); color:var(--red); font-size:24px; display:grid; place-items:center; cursor:pointer; box-shadow:0 0 15px var(--red-glow); }

@media(max-width: 600px) {
    .stats-grid { grid-template-columns: 1fr; }
    .balance-card .coin-amount { font-size: 40px; }
    .navbar { padding: 15px 4%; }
}
</style>
</head>
<body class="theme-red" onload="loadUserData()">

<div id="fire-layer"></div>

<nav class="navbar">
    <a href="dashboard.html" class="brand">
        <img src="https://i.postimg.cc/C5tfyH1H/file-00000000ba30820b8f4a7075c4fd3a41.png" alt="Logo" class="brand-logo">
        <div class="brand-text">H4X <span>ALTAF</span></div>
    </a>
    <a href="dashboard.html" class="back-btn">← BACK</a>
</nav>

<div class="container">
    <h1 class="page-title">MY <span>COINS</span></h1>

    <!-- Balance Card -->
    <div class="balance-card">
        <h2>Available Balance</h2>
        <div class="coin-amount">
            <span class="coin-icon">🪙</span>
            <span id="total-coins">0</span>
        </div>
        <p>Use these coins to host bots and websites.</p>
    </div>

    <!-- REDEEM CODE BOX -->
    <div class="redeem-box">
        <h3>🎟️ Redeem Code</h3>
        <p style="font-size:11px; color:#aaa; margin-bottom:15px;">Enter the code provided by Admin to get coins.</p>
        
        <div class="redeem-input-group">
            <input type="text" id="redeemCodeInput" placeholder="H4X-XXXX">
            <button class="redeem-btn" onclick="redeemCode()">REDEEM</button>
        </div>
        
        <div id="redeemMsg" class="msg-box"></div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-box">
            <h3>TOTAL ADDED</h3>
            <p id="total-added">0</p>
        </div>
        <div class="stat-box">
            <h3>TOTAL SPENT</h3>
            <p id="total-spent">0</p>
        </div>
    </div>

    <!-- History -->
    <div class="history-section">
        <h3>Recent Transactions</h3>
        <div id="history-list">
            <!-- Transactions will be injected here by JS -->
        </div>
    </div>
</div>

<script>
/* ===== FIRE ANIMATION ===== */
(function(){
    const layer = document.getElementById("fire-layer");
    const maxFlames = window.innerWidth < 600 ? 30 : 60;
    function createFlame() {
        if(layer.childElementCount > maxFlames) return;
        const flame = document.createElement("div");
        flame.className = "fire";
        const edges = ["bottom", "top", "left", "right"];
        const edge = edges[Math.floor(Math.random() * edges.length)];
        flame.classList.add(edge);
        const size = Math.random() * 15 + 10; 
        const duration = Math.random() * 2 + 1.5;
        const delay = Math.random() * 2;
        if (edge === "bottom" || edge === "top") {
            flame.style.width = size + "px"; flame.style.height = (size * 1.5) + "px"; flame.style.left = (Math.random() * 100) + "vw";
        } else {
            flame.style.width = (size * 1.5) + "px"; flame.style.height = size + "px"; flame.style.top = (Math.random() * 100) + "vh";
        }
        flame.style.animationDuration = duration + "s"; flame.style.animationDelay = delay + "s";
        layer.appendChild(flame);
        setTimeout(() => flame.remove(), (duration + delay) * 1000 + 500);
    }
    for(let i=0; i<maxFlames; i++) { createFlame(); }
    setInterval(() => { if(!document.hidden) createFlame(); }, 150);
})();

/* ===== LOAD USER DATA ===== */
function loadUserData() {
    let user = JSON.parse(localStorage.getItem("h4x_user"));
    if(!user) {
        window.location.href = "index.html";
        return;
    }

    // Set Coins
    let coins = user.coins || 0;
    document.getElementById("total-coins").innerText = coins;

    // Mock Stats
    document.getElementById("total-added").innerText = coins + 50; 
    document.getElementById("total-spent").innerText = 50; 

    // Dummy History
    let history = [
        { title: "Admin Added Coins", date: "Today, 10:30 AM", amount: "+100" },
        { title: "Bought Starter Plan", date: "Yesterday, 04:15 PM", amount: "-49" },
        { title: "Welcome Bonus", date: "12 Oct 2026", amount: "+20" }
    ];

    let historyContainer = document.getElementById("history-list");
    historyContainer.innerHTML = "";

    history.forEach(item => {
        let isPlus = item.amount.includes("+");
        let colorClass = isPlus ? "amount-plus" : "amount-minus";
        
        historyContainer.innerHTML += `
            <div class="history-item">
                <div class="history-info">
                    <h4>${item.title}</h4>
                    <p>${item.date}</p>
                </div>
                <div class="history-amount ${colorClass}">
                    ${item.amount} 🪙
                </div>
            </div>
        `;
    });
}

/* ===== REDEEM CODE LOGIC ===== */
function redeemCode() {
    let code = document.getElementById("redeemCodeInput").value.trim().toUpperCase();
    let msg = document.getElementById("redeemMsg");
    let user = JSON.parse(localStorage.getItem("h4x_user"));

    if(!code) {
        msg.className = "msg-box msg-error";
        msg.innerText = "Please enter a code!";
        return;
    }

    msg.className = "msg-box";
    msg.innerText = "Checking code...";

    // 🔥 SERVER KO BHEJO REDEEM KARNE KE LIYE
    fetch('https://allfixedwebhostingproject.onrender.com/api/redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code, email: user.email })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            msg.className = "msg-box msg-error";
            msg.innerText = data.error;
        } else {
            msg.className = "msg-box msg-success";
            msg.innerText = `Success! Coins added. New Balance: ${data.coins}`;
            
            // Update local storage
            user.coins = data.coins;
            localStorage.setItem("h4x_user", JSON.stringify(user));
            document.getElementById("total-coins").innerText = user.coins;
            document.getElementById("redeemCodeInput").value = "";
        }
    })
    .catch(err => {
        msg.className = "msg-box msg-error";
        msg.innerText = "Server error! Please try again.";
    });
}
</script>
</body>
</html>
