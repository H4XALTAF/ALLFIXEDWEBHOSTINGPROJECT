<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>H4X ALTAF | My Hosting</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
/* ===== MY HOSTING SPECIFIC STYLES ===== */
.container { max-width: 1100px; margin: 30px auto; padding: 0 20px; position: relative; z-index: 10; }
.page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
.page-header h1 { font: 900 26px Orbitron; }
.page-header h1 span { color: var(--red); }
.page-header p { color: #888; font-size: 12px; margin-top: 5px; }
.btn-new { background: var(--red); color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 12px; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
.btn-new:hover { transform: translateY(-3px); box-shadow: 0 5px 15px var(--red-glow); }

/* TABS */
.tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
.tabs::-webkit-scrollbar { height: 4px; }
.tabs::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
.tab-btn { background: #111; border: 1px solid var(--border); color: #aaa; padding: 10px 20px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; white-space: nowrap; }
.tab-btn:hover { border-color: var(--red); color: white; }
.tab-btn.active { background: linear-gradient(110deg, var(--dark-red), var(--red)); color: white; border-color: transparent; box-shadow: 0 5px 15px var(--red-glow); }

/* HOSTING CARDS GRID */
.hosting-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.host-card { background: linear-gradient(145deg, #151515, #0a0a0a); border: 1px solid var(--border); border-radius: 16px; padding: 25px; position: relative; overflow: hidden; transition: 0.3s; }
.host-card:hover { border-color: var(--red); box-shadow: 0 10px 30px var(--red-glow); transform: translateY(-5px); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.file-icon { width: 50px; height: 50px; background: rgba(255,37,37,0.1); border: 1px solid var(--red-glow); border-radius: 12px; display: grid; place-items: center; font-size: 24px; color: var(--red); }
.status-badge { padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }
.status-on { background: rgba(34,197,94,0.1); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
.status-off { background: rgba(255,0,0,0.1); color: #ff5555; border: 1px solid rgba(255,0,0,0.3); }
.host-card h3 { font: 800 18px Orbitron; margin-bottom: 8px; color: white; }
.file-meta { font-size: 11px; color: #777; margin-bottom: 20px; line-height: 1.6; }
.file-meta span { color: #ccc; }

/* STATS BAR */
.stats-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #000; border: 1px solid #222; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
.stat-item h4 { font-size: 10px; color: #666; margin-bottom: 5px; text-transform: uppercase; }
.stat-item p { font: 800 14px Orbitron; color: var(--red); }
.progress-bg { width: 100%; height: 6px; background: #222; border-radius: 3px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--red); border-radius: 3px; transition: 0.5s; }

/* CARD ACTIONS */
.card-actions { display: flex; gap: 10px; }
.action-btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; text-align: center; }
.btn-stop { background: rgba(255,37,37,0.1); color: #ff5555; border: 1px solid rgba(255,37,37,0.3); }
.btn-stop:hover { background: #ff5555; color: white; }
.btn-start { background: rgba(34,197,94,0.1); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
.btn-start:hover { background: #22c55e; color: white; }
.btn-logs { background: #222; color: #aaa; border: 1px solid #333; }
.btn-logs:hover { background: #333; color: white; }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 60px 20px; background: #111; border: 1px dashed #333; border-radius: 16px; }
.empty-state h2 { font: 800 20px Orbitron; margin-bottom: 10px; }
.empty-state p { color: #888; font-size: 13px; margin-bottom: 20px; }
</style>
</head>
<body class="theme-red">

<div id="fire-layer"></div>

<!-- NAVBAR -->
<nav class="navbar">
    <a href="dashboard.html" class="brand">
        <img src="https://i.postimg.cc/C5tfyH1H/file-00000000ba30820b8f4a7075c4fd3a41.png" alt="Logo" class="brand-logo">
        <div class="brand-text">H4X <span>ALTAF</span></div>
    </a>
    <div style="display:flex; gap:15px; align-items:center;">
        <div class="color-switcher">
            <div class="color-btn red active" onclick="changeTheme('theme-red', this)"></div>
            <div class="color-btn blue" onclick="changeTheme('theme-blue', this)"></div>
            <div class="color-btn green" onclick="changeTheme('theme-green', this)"></div>
            <div class="color-btn purple" onclick="changeTheme('theme-purple', this)"></div>
        </div>
        <a href="dashboard.html" class="back-btn">← BACK</a>
    </div>
</nav>

<div class="container">
    
    <div class="page-header">
        <div>
            <h1>My <span>Hosting</span></h1>
            <p>Manage all your active bots, scripts, and applications.</p>
        </div>
        <a href="upload.html" class="btn-new">+ New Upload</a>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="filterHostings('all', this)">All Services</button>
        <button class="tab-btn" onclick="filterHostings('bot', this)">Python Bots</button>
        <button class="tab-btn" onclick="filterHostings('web', this)">Websites</button>
        <button class="tab-btn" onclick="filterHostings('db', this)">Databases</button>
    </div>

    <!-- HOSTING CARDS -->
    <div class="hosting-grid" id="hostingGrid">
        <!-- JS will inject cards here -->
    </div>

</div>

<script src="script.js"></script>
<script>
    // Demo Data for hosting services
    const myHostings = [
        {
            id: "hst_001",
            name: "telegram_bot.py",
            type: "bot",
            icon: "🐍",
            runtime: "Python 3.10",
            date: "25 Oct 2026",
            status: "on",
            cpu: 45,
            ram: 120,
            limitRam: 512
        },
        {
            id: "hst_002",
            name: "portfolio_website.zip",
            type: "web",
            icon: "🌐",
            runtime: "HTML/CSS/JS",
            date: "24 Oct 2026",
            status: "off",
            cpu: 0,
            ram: 0,
            limitRam: 1024
        },
        {
            id: "hst_003",
            name: "scraper_bot.py",
            type: "bot",
            icon: "🤖",
            runtime: "Python 3.9",
            date: "22 Oct 2026",
            status: "on",
            cpu: 12,
            ram: 85,
            limitRam: 512
        }
    ];

    // Load Cards on Page Load
    document.addEventListener("DOMContentLoaded", () => {
        renderHostings(myHostings);
    });

    function renderHostings(data) {
        const grid = document.getElementById('hostingGrid');
        
        if(data.length === 0) {
            grid.innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <div style="font-size: 40px; margin-bottom: 10px;">📁</div>
                    <h2>No Hostings Found</h2>
                    <p>You haven't uploaded any files in this category yet.</p>
                    <a href="upload.html" class="btn-new" style="display:inline-block;">+ Upload Now</a>
                </div>
            `;
            return;
        }

        grid.innerHTML = "";
        data.forEach(host => {
            let isOnline = host.status === "on";
            let badgeClass = isOnline ? "status-on" : "status-off";
            let badgeText = isOnline ? "● RUNNING" : "● STOPPED";
            
            // RAM Calculation Percentage
            let ramPercent = Math.min((host.ram / host.limitRam) * 100, 100);

            grid.innerHTML += `
                <div class="host-card">
                    <div class="card-top">
                        <div class="file-icon">${host.icon}</div>
                        <span class="status-badge ${badgeClass}">${badgeText}</span>
                    </div>
                    
                    <h3>${host.name}</h3>
                    <p class="file-meta">
                        Runtime: <span>${host.runtime}</span> <br>
                        Deployed: <span>${host.date}</span>
                    </p>

                    <div class="stats-bar">
                        <div class="stat-item">
                            <h4>CPU Usage</h4>
                            <p>${host.cpu}%</p>
                        </div>
                        <div class="stat-item">
                            <h4>RAM Usage</h4>
                            <p>${host.ram} / ${host.limitRam} MB</p>
                            <div class="progress-bg">
                                <div class="progress-fill" style="width: ${ramPercent}%; background: ${ramPercent > 80 ? '#ff5555' : 'var(--red)'};"></div>
                            </div>
                        </div>
                    </div>

                    <div class="card-actions">
                        ${isOnline 
                            ? `<button class="action-btn btn-stop" onclick="toggleStatus('${host.id}', this)">Stop App</button>`
                            : `<button class="action-btn btn-start" onclick="toggleStatus('${host.id}', this)">Start App</button>`
                        }
                        <button class="action-btn btn-logs" onclick="alert('Live logs terminal console feature coming soon!')">View Logs</button>
                    </div>
                </div>
            `;
        });
    }

    // Filter Logic
    function filterHostings(type, element) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if(element) element.classList.add('active');

        if(type === 'all') {
            renderHostings(myHostings);
        } else {
            let filtered = myHostings.filter(h => h.type === type);
            renderHostings(filtered);
        }
    }

    // Toggle Status (Start/Stop)
    function toggleStatus(id, btnElement) {
        let host = myHostings.find(h => h.id === id);
        if(!host) return;

        // Button animation
        btnElement.innerText = "Processing...";
        btnElement.disabled = true;

        setTimeout(() => {
            if(host.status === "on") {
                host.status = "off";
                host.cpu = 0;
                host.ram = 0;
            } else {
                host.status = "on";
                host.cpu = Math.floor(Math.random() * 50) + 10; // fake cpu
                host.ram = Math.floor(Math.random() * 200) + 50; // fake ram
            }
            
            // Re-render current view
            let activeTab = document.querySelector('.tab-btn.active').innerText;
            if(activeTab.includes("All")) filterHostings('all');
            else if(activeTab.includes("Bots")) filterHostings('bot');
            else if(activeTab.includes("Websites")) filterHostings('web');
            else if(activeTab.includes("Databases")) filterHostings('db');
            
        }, 1000); // 1 second ka fake delay
    }
</script>
</body>
</html>
